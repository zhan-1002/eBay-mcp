[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-mcp-server"
version = "0.1.0"
description = "A general-purpose MCP server for eBay APIs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.3.0,<2",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
ebay-mcp-server = "ebay_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ebay_mcp_server*"]

[tool.setuptools.package-data]
ebay_mcp_server = ["skills/*/*.md", "skills/*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
